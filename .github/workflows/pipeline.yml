name: CI/CD - K8s Infra (Castor Garage)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Terraform fmt/validate/plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      # terraform init precisa de credenciais mesmo so pra ler o backend S3
      - name: Configurar credenciais AWS (sessao temporaria do Academy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # O bucket do state leva o ID da conta AWS das credenciais em uso
      # (castor-garage-tfstate-<account-id>), entao o pipeline funciona com a
      # conta do Academy de qualquer integrante. Cria o bucket se nao existir.
      - name: Terraform init
        run: |
          TFSTATE_BUCKET="castor-garage-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          if ! aws s3api head-bucket --bucket "$TFSTATE_BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$TFSTATE_BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$TFSTATE_BUCKET" --versioning-configuration Status=Enabled
          fi
          terraform init -backend-config="bucket=${TFSTATE_BUCKET}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color
        env:
          TF_VAR_lab_role_arn: ${{ secrets.LAB_ROLE_ARN }}
          TF_VAR_new_relic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}

  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configurar credenciais AWS (sessao temporaria do Academy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@v4

      - uses: azure/setup-helm@v4

      # Mesmo bucket por conta do job validate.
      - name: Terraform init
        run: |
          TFSTATE_BUCKET="castor-garage-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          terraform init -backend-config="bucket=${TFSTATE_BUCKET}"

      - name: Terraform apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_lab_role_arn: ${{ secrets.LAB_ROLE_ARN }}
          TF_VAR_new_relic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}

      - name: Mostrar outputs
        run: |
          terraform output cluster_name
          terraform output update_kubeconfig_command
